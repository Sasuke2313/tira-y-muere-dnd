<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tira y Muere - Party de Petra</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
body{background:#1a0f0a;color:#f5e6c8;font-family:Georgia,serif;padding:15px;max-width:900px;margin:auto}
h1{text-align:center;color:#ffcc00;margin:5px}
.sub{text-align:center;color:#ccc;font-size:14px}
.card{background:#2d1a0f;border:2px solid #8b5a2b;border-radius:12px;padding:15px;margin:10px 0}
.tabs{display:flex;gap:5px;flex-wrap:wrap}
.tab{flex:1;padding:10px;background:#4a2c15;color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:bold}
.tab.active{background:#ffcc00;color:#000}
label{display:block;margin:6px 0 2px;font-size:13px;color:#ffcc99}
input,select{width:100%;padding:8px;border-radius:6px;border:1px solid #555;background:#fff;color:#000;box-sizing:border-box}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.stat-box{background:#3a2415;padding:8px;border-radius:8px;text-align:center;font-size:13px}
button.big{width:100%;padding:14px;background:#c0392b;color:#fff;font-size:18px;border:none;border-radius:10px;margin-top:12px;cursor:pointer}
button.gold{width:100%;padding:12px;background:#ffcc00;color:#000;font-weight:bold;border:none;border-radius:10px;margin-top:8px;cursor:pointer}
#log{background:#000;color:#aaffaa;padding:12px;border-radius:8px;white-space:pre-wrap;min-height:220px;margin-top:12px;font-family:monospace;font-size:13px}
</style>
</head>
<body>
<h1>🍺 TIRA Y MUERE 🍺</h1>
<p class="sub">Party  - Vs 8 Bandidos + 3 Jabalís</p>

<div class="card">
<h3>📄 Importar PDF de Nivel20</h3>
<p style="font-size:13px">Sube tu hoja (como la de Vavaf) y te rellena a VAVAF solo.</p>
<input type="file" id="pdfInput" accept=".pdf">
<div id="pdfStatus" style="font-size:13px;margin-top:6px;color:#ffcc00"></div>
</div>

<div class="tabs">
<button class="tab active" onclick="showPlayer(0)">VAVAF</button>
<button class="tab" onclick="showPlayer(1)">KORGATH</button>
<button class="tab" onclick="showPlayer(2)">NYX</button>
<button class="tab" onclick="showPlayer(3)">ZERO</button>
</div>

<div id="playerCard" class="card"></div>

<div class="card">
<h3>⚔️ Enemigos</h3>
<div class="grid">
<div><label>Bandidos (cantidad)</label><input id="enemigos" type="number" value="8"></div>
<div><label>HP Bandido</label><input id="hpEnemigo" type="number" value="11"></div>
<div><label>CA Bandido</label><input id="caEnemigo" type="number" value="12"></div>
<div><label>Jabalís</label><input id="jabalis" type="number" value="3"></div>
</div>
</div>

<button class="big" onclick="simular()">🎲 ¡SIMULAR PELEA DE LA PARTY!</button>
<button class="gold" onclick="location.reload()">↻ Resetear</button>

<div id="log">Esperando dados...</div>

<script>
const presets = [
{name:"VAVAF - El Que Dudó", clase:"Monje 9, Pícaro 2, Mago 1", raza:"Mediano Piesligeros", hp:92, ca:12, bono:5, dano:"1d10", ataques:3, dot:0, fue:13, des:14, con:11, int:14, sab:10, car:13, historia:"Monje de Petra. Descubrió que los dioses están aprisionados."},
{name:"KORGATH - El Rompe-Reinos", clase:"Bárbaro 8, Guerrero 4", raza:"Semiorco", hp:128, ca:15, bono:8, dano:"1d8+4", ataques:2, dot:0, fue:18, des:13, con:16, int:10, sab:12, car:8, historia:"Ex-guardia del templo falso. Quemó su uniforme."},
{name:"NYX - La Hija del Fuego", clase:"Mago 9, Brujo 3", raza:"Elfa", hp:68, ca:13, bono:7, dano:"1d8+3", ataques:1, dot:3, fue:8, des:14, con:13, int:17, sab:12, car:14, historia:"Escucha la voz de Petra en sueños."},
{name:"ZERO - El Fantasma", clase:"Pícaro 9, Monje 3", raza:"Mediano Piesligeros", hp:84, ca:15, bono:7, dano:"1d6+3", ataques:2, dot:2, fue:10, des:17, con:12, int:13, sab:14, car:11, historia:"Ladrón del templo. Vavaf lo dejó ir."}
];
let players = JSON.parse(JSON.stringify(presets));
let current = 0;

function showPlayer(i){
  current = i;
  document.querySelectorAll('.tab').forEach((b,idx)=>b.classList.toggle('active', idx===i));
  let p = players[i];
  document.getElementById('playerCard').innerHTML = `
    <h3>${p.name}</h3><p style="font-size:13px">${p.clase} | ${p.raza}<br><i>${p.historia}</i></p>
    <div class="grid3">
      <div class="stat-box">FUE<br><b>${p.fue}</b><input type="number" value="${p.fue}" onchange="players[${i}].fue=+this.value"></div>
      <div class="stat-box">DES<br><b>${p.des}</b><input type="number" value="${p.des}" onchange="players[${i}].des=+this.value"></div>
      <div class="stat-box">CON<br><b>${p.con}</b><input type="number" value="${p.con}" onchange="players[${i}].con=+this.value"></div>
      <div class="stat-box">INT<br><b>${p.int}</b><input type="number" value="${p.int}" onchange="players[${i}].int=+this.value"></div>
      <div class="stat-box">SAB<br><b>${p.sab}</b><input type="number" value="${p.sab}" onchange="players[${i}].sab=+this.value"></div>
      <div class="stat-box">CAR<br><b>${p.car}</b><input type="number" value="${p.car}" onchange="players[${i}].car=+this.value"></div>
    </div>
    <div class="grid">
      <div><label>HP</label><input type="number" value="${p.hp}" onchange="players[${i}].hp=+this.value"></div>
      <div><label>CA</label><input type="number" value="${p.ca}" onchange="players[${i}].ca=+this.value"></div>
      <div><label>Bono para pegar</label><input type="number" value="${p.bono}" onchange="players[${i}].bono=+this.value"></div>
      <div><label>Daño (ej: 1d10, 1d8+4)</label><input type="text" value="${p.dano}" onchange="players[${i}].dano=this.value"></div>
      <div><label>Ataques por turno</label><input type="number" value="${p.ataques}" onchange="players[${i}].ataques=+this.value"></div>
      <div><label>Daño en el tiempo (veneno / quemadura)</label><input type="number" value="${p.dot}" onchange="players[${i}].dot=+this.value"></div>
    </div>
  `;
}
showPlayer(0);

function tirar(dado){ return Math.floor(Math.random()*dado)+1; }
function parseDano(str){
  let m = str.toLowerCase().match(/(\d+)d(\d+)\s*([+-]\d+)?/);
  if(!m) return 1;
  let n=+m[1], d=+m[2], bonus=m[3]?+m[3]:0;
  let total=bonus;
  for(let k=0;k<n;k++) total+=tirar(d);
  return total;
}

function simular(){
  let log = "=== TIRA Y MUERE - PARTY ===\n";
  let numEnem = +document.getElementById('enemigos').value;
  let hpEnem = +document.getElementById('hpEnemigo').value;
  let caEnem = +document.getElementById('caEnemigo').value;
  let jab = +document.getElementById('jabalis').value;
  let enemigos = [];
  for(let i=0;i<numEnem;i++) enemigos.push({nombre:"Bandido "+(i+1), hp:hpEnem, vivo:true});
  for(let i=0;i<jab;i++) enemigos.push({nombre:"Jabalí "+(i+1), hp:15, vivo:true});
  log += `Enemigos: ${numEnem} bandidos + ${jab} jabalís = ${enemigos.length}\n\n`;
  for(let ronda=1;ronda<=3;ronda++){
    log += `--- RONDA ${ronda} ---\n`;
    players.forEach(p=>{
      for(let a=0;a<p.ataques;a++){
        let vivo = enemigos.find(e=>e.vivo);
        if(!vivo){ log+=`Ya no hay enemigos!\n`; return; }
        let d20 = tirar(20);
        let total = d20 + p.bono;
        let crit = d20===20;
        if(total >= caEnem || crit){
          let dmg = parseDano(p.dano);
          if(crit) dmg *= 2;
          if(p.dot>0) dmg += p.dot;
          vivo.hp -= dmg;
          log += `${p.name} tira ${d20}+${p.bono}=${total} ${crit?"CRITICO!":""} -> ${dmg} daño a ${vivo.nombre} (HP queda ${Math.max(0,vivo.hp)})\n`;
          if(vivo.hp<=0){ vivo.vivo=false; log+=`☠️ ${vivo.nombre} MUERTO!\n`; }
        } else {
          log += `${p.name} tira ${d20}+${p.bono}=${total} -> FALLA vs CA ${caEnem}\n`;
        }
      }
    });
    log += `\n`;
  }
  let muertos = enemigos.filter(e=>!e.vivo).length;
  log += `=== RESULTADO 3 RONDAS: ${muertos}/${enemigos.length} enemigos muertos ===\n`;
  log += `Vavaf y su party siguen de pie. ¡A por Petra!`;
  document.getElementById('log').textContent = log;
}

document.getElementById('pdfInput').addEventListener('change', async (e)=>{
  let file = e.target.files[0];
  if(!file) return;
  document.getElementById('pdfStatus').textContent = "Leyendo PDF...";
  let buf = await file.arrayBuffer();
  let pdf = await pdfjsLib.getDocument({data:buf}).promise;
  let fullText = "";
  for(let i=1;i<=pdf.numPages;i++){
    let page = await pdf.getPage(i);
    let tc = await page.getTextContent();
    fullText += tc.items.map(it=>it.str).join(" ") + "\n";
  }
  let getNum = (re)=>{ let m=fullText.match(re); return m?parseInt(m[1]):null; };
  let hp = getNum(/Puntos de Golpe M[aá]ximos\s*(\d+)/i) || getNum(/M[aá]ximos\s*(\d+)/i);
  let ca = getNum(/\b(\d+)\s*CA\b/i) || getNum(/CA\s*(\d+)/i);
  let fue = getNum(/FUERZA.*?(\d{1,2})/i);
  let des = getNum(/DESTREZA.*?(\d{1,2})/i);
  let con = getNum(/CONSTITUCI[OÓ]N.*?(\d{1,2})/i);
  let intv = getNum(/INTELIGENCIA.*?(\d{1,2})/i);
  if(hp) players[0].hp = hp;
  if(ca) players[0].ca = ca;
  if(fue) players[0].fue = fue;
  if(des) players[0].des = des;
  if(con) players[0].con = con;
  if(intv) players[0].int = intv;
  document.getElementById('pdfStatus').textContent = `¡Listo! PDF leído: VAVAF - HP ${players[0].hp} CA ${players[0].ca} FUE ${players[0].fue} DES ${players[0].des}`;
  showPlayer(0);
  alert("PDF importado a VAVAF. Ya puedes simular con tus stats reales.");
});
</script>
</body>
</html>
